<!-- ===================== index.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ankita ❤️</title>

  <!-- Romantic Handwriting Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
    }

    /* Ankita Name Style */
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: white;
      margin-top: 40px;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff4b5c, 0 0 30px #ff4b5c;
    }

    section {
      background: white;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      position: relative;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      background: #ff4b5c;
      color: white;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    #noBtn {
      background: #999;
      position: relative;
    }
  </style>
</head>
<body>

<h1 id="typing"></h1>

<section>
  <p>You are someone really special ✨</p>
</section>

<section>
  <h2>Your Favorite 🍜</h2>
  <p>I heard you love Chinese food 😋<br>Maybe someday we can enjoy noodles together 😉</p>
</section>

<section>
  <h2>Final Question...</h2>
  <p>Would you like to spend some time with me? 😊</p>
  <a href="2nd.html" class="btn">Yes 💖</a>
  <button id="noBtn" class="btn">No 😅</button>
</section>

<script>
  // Typing Animation
  const text = "Hey Ankita ❤️";
  let i = 0;
  function typeEffect() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeEffect, 100);
    }
  }
  typeEffect();

  // Moving No Button
  const noBtn = document.getElementById('noBtn');
  noBtn.addEventListener('mouseover', () => {
    const parent = noBtn.parentElement;
    const rect = parent.getBoundingClientRect();

    const x = Math.random() * (rect.width - 120);
    const y = Math.random() * (rect.height - 50);

    noBtn.style.position = 'absolute';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });
</script>

</body>
</html>
